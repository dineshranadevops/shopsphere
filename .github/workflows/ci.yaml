name: ShopSphere CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shopsphere-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # Secret Detection
  # ============================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2


  # ============================================================
  # Java - Adservice
  # ============================================================
  java-test:
    name: Java - Adservice Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: application/adservice

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run Gradle tests
        run: ./gradlew test


  # ============================================================
  # .NET - Cartservice
  # ============================================================
  dotnet-test:
    name: .NET - Cartservice Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore \
            application/cartservice/tests/cartservice.tests.csproj

      - name: Run tests
        run: |
          dotnet test \
            application/cartservice/tests/cartservice.tests.csproj \
            --no-restore \
            --configuration Release


  # ============================================================
  # Go Services
  # ============================================================
  go-test:
    name: Go - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - checkoutservice
          - frontend
          - productcatalogservice
          - shippingservice

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: application/${{ matrix.service }}/go.sum

      - name: Run tests
        working-directory: application/${{ matrix.service }}
        run: go test ./...


  # ============================================================
  # Node.js Services
  # ============================================================
  node-validation:
    name: Node.js - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - currencyservice
          - paymentservice

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: application/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: application/${{ matrix.service }}
        run: npm ci

      - name: Check npm audit
        working-directory: application/${{ matrix.service }}
        run: npm audit --audit-level=high


  # ============================================================
  # Python Validation
  # ============================================================
  python-validation:
    name: Python - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - emailservice
          - recommendationservice

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compile Python source
        working-directory: application/${{ matrix.service }}
        run: python -m compileall -q .


  # ============================================================
  # CI Gate
  # ============================================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - java-test
      - dotnet-test
      - go-test
      - node-validation
      - python-validation

    steps:
      - name: CI validation successful
        run: echo "All ShopSphere CI checks passed."
