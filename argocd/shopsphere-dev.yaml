apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/dineshranadevops/shopsphere.git
    targetRevision: main
    path: kubernetes/dev

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: shopsphere

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

